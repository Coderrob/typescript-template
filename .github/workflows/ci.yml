name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.job }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint-checks:
    name: Link Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        id: checkout-source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        id: enable-corepack
        run: corepack enable

      - name: Prepare Yarn
        id: prepare-yarn
        run: corepack prepare yarn@4.9.1 --activate

      # Ensure clean state (remove any generated files)
      - name: Clean generated files
        run: rm -f .yarn/install-state.gz

      - name: Install Dependencies
        id: install-dependencies
        run: yarn install

      - name: Lint Check
        id: lint-check
        run: yarn lint

      - name: Super Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: dist/**/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: ${{ github.workspace }}
          VALIDATE_EDITORCONFIG: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_STANDARD: false

  unit-testing:
    needs: lint-checks
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        id: checkout-source
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        id: enable-corepack
        run: corepack enable

      - name: Prepare Yarn
        id: prepare-yarn
        run: corepack prepare yarn@4.9.1 --activate

      # Ensure clean state (remove any generated files)
      - name: Clean generated files
        run: rm -f .yarn/install-state.gz

      - name: Install Dependencies
        id: install-dependencies
        run: yarn install

      - name: Unit Tests
        id: unit-test
        run: yarn test

  build:
    needs:
      - lint-checks
      - unit-testing
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        id: checkout-source
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        id: enable-corepack
        run: corepack enable

      - name: Prepare Yarn
        id: prepare-yarn
        run: corepack prepare yarn@4.9.1 --activate

      # Ensure clean state (remove any generated files)
      - name: Clean generated files
        run: rm -f .yarn/install-state.gz

      - name: Install Dependencies
        id: install-dependencies
        run: yarn install

      - name: Build Package
        id: build-package
        run: yarn package

      - name: Verify Build Output
        id: verify-build
        run: |
          if [ ! -f "dist/index.mjs" ]; then
            echo "Error: Build output not found"
            exit 1
          fi
          echo "Build output verified successfully"
